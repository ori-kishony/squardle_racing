# fly.toml app configuration file generated for squardle-racing on 2026-10-04T13:44:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'squardle-racing'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/squardle_racing.sqlite3'
  NODE_ENV = 'production'
  OFFICIAL_TODAY_PATH = '/data/official-today.json'

[[mounts]]
  source = 'squardle_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
